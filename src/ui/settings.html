<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'">
<title>设置</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; -webkit-user-select: none; user-select: none; }
  body { font: 12.5px/1.45 "Microsoft YaHei UI", system-ui, sans-serif; color: #17191c; padding: 10px; }

  #panel {
    height: 100%;
    background: rgba(250, 250, 251, 0.975);
    border: 1px solid rgba(20, 23, 26, 0.16);
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    display: flex;
    flex-direction: column;
  }

  header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px 9px; flex: none; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  #close { border: 0; background: transparent; font-size: 16px; line-height: 1; color: #6b7076; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #close:hover { background: rgba(20, 23, 26, .08); color: #17191c; }

  .scroll { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(20,23,26,.18); border-radius: 4px; }

  section { padding: 9px 0 11px; border-top: 1px solid rgba(20,23,26,.1); }
  section:first-child { border-top: 0; padding-top: 2px; }
  h2 { margin: 0 0 9px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #7a7f86; }
  .sub-h { margin-top: 16px; }
  .sub-h .tip { font-weight: 400; letter-spacing: 0; color: #a6abb1; }
  .slot-acts button[disabled] { color: #a6abb1; cursor: default; }

  .row { display: grid; grid-template-columns: 52px 1fr 46px; align-items: center; gap: 10px; margin-bottom: 9px; }
  .row label { color: #44494f; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; color: #14171a; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #14171a var(--fill, 50%), #dfe6ee var(--fill, 50%)); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #14171a; cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

  .icon-row { display: flex; align-items: center; gap: 10px; }
  #preview { width: 42px; height: 42px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.85), rgba(255,255,255,0) 58%), linear-gradient(155deg,#ffffff,#f0f1f3 52%,#dcdfe4); }
  #preview svg { width: 21px; height: 21px; stroke: currentColor; stroke-width: 1.9; fill: none; color: #14171a; }
  #preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #preview.has-icon img { display: block; }
  #preview.has-icon svg { display: none; }

  button.act { border: 1px solid rgba(20,23,26,.2); background: #fff; color: #1b1e22; border-radius: 8px; padding: 5px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  button.act:hover { background: #f2f3f5; border-color: rgba(20,23,26,.34); }
  button.ghost { border-color: transparent; background: transparent; color: #6b7076; }
  button.ghost:hover { background: rgba(20,23,26,.07); color: #1b1e22; }
  .spacer { flex: 1; }

  .switch { display: flex; align-items: center; justify-content: space-between; }
  .track { width: 38px; height: 20px; border-radius: 20px; background: #dcdedf; position: relative; cursor: pointer; transition: background .15s; flex: none; }
  .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .track.on { background: #14171a; }
  .track.on::after { transform: translateX(18px); }

  .slot-row { display: grid; grid-template-columns: 20px 26px 1fr auto; align-items: center; gap: 8px; padding: 4px 0; }
  .slot-row + .slot-row { border-top: 1px solid rgba(20,23,26,.07); }
  .slot-n { font-variant-numeric: tabular-nums; color: #94989d; font-size: 11px; text-align: center; }
  .slot-icon { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(20,23,26,.09); color: #14171a; }
  .slot-icon svg { width: 15px; height: 15px; }
  .slot-icon .appicon { width: 18px; height: 18px; }
  .slot-row.empty .slot-icon { background: transparent; color: #c7cacd; }
  .slot-name { min-width: 0; }
  .slot-name b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-name span { display: block; font-size: 11px; color: #878c92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-acts { display: flex; gap: 2px; opacity: 0; transition: opacity 120ms ease; }
  .slot-row:hover .slot-acts, .chooser { opacity: 1; }
  .slot-acts button { border: 0; background: transparent; color: #6b7076; cursor: pointer; padding: 3px 5px; border-radius: 6px; font-size: 11.5px; }
  .slot-acts button:hover { background: rgba(20,23,26,.09); color: #1b1e22; }

  .chooser { position: absolute; z-index: 5; background: #fff; border: 1px solid rgba(20,23,26,.2); border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.24); padding: 4px; display: none; }
  .chooser.show { display: block; }
  .chooser button { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: transparent; padding: 6px 9px; border-radius: 7px; cursor: pointer; font: inherit; color: #1b1e22; text-align: left; }
  .chooser button:hover { background: #f2f3f5; }
  .chooser svg { width: 14px; height: 14px; color: #14171a; }

  #error { min-height: 14px; font-size: 11px; color: #a4323f; padding: 0 16px 6px; flex: none; }
  .about { color: #878c92; font-size: 11px; }

  .seg { display: flex; gap: 2px; background: rgba(20,23,26,.08); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: #6b7076; font: inherit; font-size: 11.5px; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: #fff; color: #1b1e22; box-shadow: 0 1px 3px rgba(0,0,0,.16); }

  #panel { position: relative; }
  #picker {
    position: absolute; inset: 10px;
    background: rgba(250, 250, 251, 0.99);
    border: 1px solid rgba(20,23,26,.16);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,.3);
    display: none; flex-direction: column; padding: 12px; gap: 9px;
  }
  #picker.show { display: flex; }
  #filter { border: 1px solid rgba(20,23,26,.22); border-radius: 8px; padding: 6px 10px; font: inherit; outline: none; background: #fff; }
  #filter:focus { border-color: #14171a; }
  #list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb { background: rgba(20,23,26,.18); border-radius: 4px; }
  .prog { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .prog:hover { background: #f2f3f5; }
  .prog svg { width: 14px; height: 14px; color: #14171a; flex: none; }
  .prog .ic { display: grid; place-items: center; width: 18px; flex: none; }
  .prog .ic svg { width: 14px; height: 14px; }
  .prog .ic .appicon { width: 18px; height: 18px; }
  .prog b { display: block; font-weight: 500; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog .sub { display: block; font-size: 11px; color: #8b9095; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; }
  .prog .txt { min-width: 0; flex: 1; }
  .pfoot { display: flex; align-items: center; flex: none; }
  .empty-tip { color: #8b9095; font-size: 11.5px; padding: 10px 8px; }

  .prog.used { opacity: .45; cursor: default; }
  .prog.used:hover { background: transparent; }
  .prog .tag { flex: none; font-size: 10.5px; color: #8b9095; }
  .chooser button[disabled] { color: #a6abb1; cursor: default; }
  .chooser button[disabled]:hover { background: transparent; }
  .chooser button i { margin-left: auto; font-style: normal; font-size: 10.5px; color: #8b9095; }
</style>
</head>
<body>
  <div id="panel">
    <header>
      <h1>浮窗坞设置</h1>
      <button id="close" title="关闭">×</button>
    </header>

    <div class="scroll">
      <section>
        <h2>外观</h2>
        <div class="row">
          <label for="opacity">透明度</label>
          <input id="opacity" type="range" min="20" max="100" step="1">
          <output id="opacityOut">85%</output>
        </div>
        <div class="row">
          <label for="size">大小</label>
          <input id="size" type="range" min="40" max="180" step="2">
          <output id="sizeOut">64px</output>
        </div>
        <div class="icon-row">
          <div id="preview"></div>
          <button class="act" id="upload">上传图标</button>
          <button class="act ghost" id="default">恢复默认</button>
        </div>
      </section>

      <section>
        <h2>功能圈槽位</h2>
        <div id="slots"></div>
        <h2 class="sub-h">第二层 · 外圈<span id="slots2Tip" class="tip">（填满第一层 10 格后解锁）</span></h2>
        <div id="slots2"></div>
      </section>

      <section>
        <h2>系统</h2>
        <div class="switch">
          <label>快捷文本框</label>
          <div class="seg" id="noteMode">
            <button data-mode="built-in">内置窗口</button>
            <button data-mode="system">系统记事本</button>
          </div>
        </div>
        <div class="switch" style="margin-top:10px">
          <label for="launch">开机自启</label>
          <div class="track" id="launch" role="switch" tabindex="0" aria-checked="false"></div>
        </div>
      </section>

      <section>
        <h2>关于</h2>
        <div class="about"><span id="version"></span> · 图标 Lucide（ISC）</div>
      </section>
    </div>

    <div class="chooser" id="chooser"></div>

    <div id="picker">
      <input id="filter" type="text" placeholder="搜索程序" spellcheck="false">
      <div id="list"></div>
      <div class="pfoot">
        <button class="act" id="browse">浏览…</button>
        <div class="spacer"></div>
        <button class="act ghost" id="pcancel">取消</button>
      </div>
    </div>

    <div id="error"></div>
  </div>
<script src="icons.js"></script>
<script src="settings.js"></script>
</body>
</html>
